    post:
      operationId: createPfClient
      tags: [pf-clients]
      summary: Create client
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePfClientBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PfClient"

  /pf/clients/{id}:
    get:
      operationId: getPfClient
      tags: [pf-clients]
      summary: Get client
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PfClient"
    put:
      operationId: updatePfClient
      tags: [pf-clients]
      summary: Update client
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePfClientBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PfClient"
    delete:
      operationId: deletePfClient
      tags: [pf-clients]
      summary: Delete client
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ─── PF PROPOSALS ─────────────────────────────────────────────────────────────

  /pf/proposals:
    get:
      operationId: listPfProposals
      tags: [pf-proposals]
      summary: List proposals
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [draft, sent, viewed, accepted, rejected]
        - in: query
          name: clientId
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PfProposal"
    post:
      operationId: createPfProposal
      tags: [pf-proposals]
