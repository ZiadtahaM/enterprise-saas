  # ─── AL PROPERTIES ────────────────────────────────────────────────────────────

  /al/properties:
    get:
      operationId: listAlProperties
      tags: [al-properties]
      summary: List properties
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [available, under_contract, sold, rented, off_market]
        - in: query
          name: type
          schema:
            type: string
            enum: [sale, rent]
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
