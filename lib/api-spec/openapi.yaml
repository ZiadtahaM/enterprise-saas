          name: done
          schema:
            type: boolean
        - in: query
          name: upcoming
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlReminder"
    post:
      operationId: createAlReminder
      tags: [al-reminders]
      summary: Create reminder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAlReminderBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlReminder"

  /al/reminders/{id}:
    put:
      operationId: updateAlReminder
      tags: [al-reminders]
      summary: Update reminder
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
