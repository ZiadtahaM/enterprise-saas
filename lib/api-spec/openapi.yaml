openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ProposalForge & AgentLead API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: pf-clients
    description: ProposalForge clients
  - name: pf-proposals
    description: ProposalForge proposals
  - name: pf-contracts
    description: ProposalForge contracts
  - name: pf-deposits
    description: ProposalForge deposits
  - name: pf-dashboard
    description: ProposalForge dashboard
  - name: al-properties
    description: AgentLead properties
  - name: al-leads
    description: AgentLead leads
  - name: al-deals
    description: AgentLead deals
  - name: al-reminders
    description: AgentLead reminders
  - name: al-dashboard
    description: AgentLead dashboard

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ───────────────────────────────────────────────────────────────────

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ─── PF DASHBOARD ────────────────────────────────────────────────────────────

  /pf/dashboard:
    get:
      operationId: getPfDashboard
      tags: [pf-dashboard]
      summary: ProposalForge dashboard summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PfDashboard"

  # ─── PF CLIENTS ───────────────────────────────────────────────────────────────

  /pf/clients:
    get:
      operationId: listPfClients
      tags: [pf-clients]
      summary: List clients
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
