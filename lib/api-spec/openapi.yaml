                $ref: "#/components/schemas/PfProposalDetail"
    put:
      operationId: updatePfProposal
      tags: [pf-proposals]
      summary: Update proposal
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePfProposalBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PfProposalDetail"
    delete:
      operationId: deletePfProposal
      tags: [pf-proposals]
      summary: Delete proposal
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /pf/proposals/{id}/status:
    patch:
      operationId: updatePfProposalStatus
      tags: [pf-proposals]
      summary: Update proposal status
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
