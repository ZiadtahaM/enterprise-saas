kind = "web"
previewPath = "/"
title = "ProposalForge & AgentLead"
version = "1.0.0"
id = "artifacts/frontend"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/dev-disabled" ]
localPort = 8082

[services.development]
run = "pnpm --filter @workspace/frontend run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/frontend", "run", "build" ]
publicDir = "artifacts/frontend/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "8082"
BASE_PATH = "/"
